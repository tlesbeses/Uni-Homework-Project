name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - features

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (check + tests + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edunotas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-insecure-secret-key-for-tests-only
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/edunotas
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt coverage pip-audit

      - name: Django system check
        run: python manage.py check

      - name: Check no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage combine
          coverage report --fail-under=85
          coverage json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.json

      - name: Audit Python dependencies
        # Sin ignores: djoser 2.3.5 permite social-auth-app-django 7.1.0,
        # que ya no arrastra los advisories de social-auth-core 4.9.1.
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint + tests + coverage + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        # El endpoint de auditoría de npm (registry.npmjs.org/-/npm/v1/
        # security/audits/quick) devuelve 503 con frecuencia y tumbaba el
        # build por una caída ajena al repo. Reintentamos SOLO los fallos de
        # red; un advisory real falla al primer intento. Se usa un loop en
        # vez de una action de terceros porque este step depende del
        # defaults.run.working-directory del job (frontend/), que una
        # `uses:` no hereda.
        run: |
          for i in 1 2 3; do
            if output=$(npm audit --audit-level=high 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if echo "$output" | grep -qE "503|Service Unavailable|audit endpoint"; then
              echo "Fallo de red del registry (intento $i); reintentando en 30s..."
              sleep 30
            else
              echo "Fallo real de auditoría; no se reintenta."
              exit 1
            fi
          done
          echo "Se agotaron los reintentos por caídas del registry de npm."
          exit 1

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build
        run: npm run build