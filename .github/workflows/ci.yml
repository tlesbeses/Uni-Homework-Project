name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - features

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (check + tests + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edunotas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-insecure-secret-key-for-tests-only
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/edunotas
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt coverage pip-audit

      - name: Django system check
        run: python manage.py check

      - name: Check no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage combine
          coverage report --fail-under=85
          coverage json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.json

      - name: Audit Python dependencies
        run: |
          # social-auth-core==4.9.1 queda con 6 advisories (5 en 5.0.0 y
          # CVE-2026-62322 en 5.0.2). La app NO usa login social; la
          # dependencia entra por djoser (social-auth-app-django) y el
          # arreglo exige social-auth-app-django 6.x, que djoser 2.3.4/2.3.5
          # sigue bloqueando (<6.0.0). Re-evaluar al subir djoser, o evaluar
          # sacar social-auth por completo. El resto de las dependencias
          # (PyJWT, urllib3, certifi, oauthlib) se bumpearon y quedaron limpias.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-4165 \
            --ignore-vuln PYSEC-2026-4166 \
            --ignore-vuln PYSEC-2026-4167 \
            --ignore-vuln PYSEC-2026-4168 \
            --ignore-vuln PYSEC-2026-4169 \
            --ignore-vuln CVE-2026-62322

  frontend:
    name: Frontend (lint + tests + coverage + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        # El endpoint de auditoría de npm devuelve 503 con frecuencia
        # (registry.npmjs.org/-/npm/v1/security/audits/quick). Se reintenta
        # para no tumbar el build por una caída de un servicio externo; si
        # hay advisories reales, falla igual tras los intentos.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build
        run: npm run build