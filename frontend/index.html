<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Plataforma de gestión académica" />
  <meta name="theme-color" content="#312e81" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EduNotas" />
  <title>EduNotas</title>
</head>

<body>
  <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#312e81;z-index:9999;transition:opacity .3s">
    <div style="width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin-bottom:20px">
      <span style="font-size:28px;font-weight:900;color:#fff;letter-spacing:-.5px">EN</span>
    </div>
    <span style="font-size:22px;font-weight:700;color:#fff;letter-spacing:.5px">EduNotas</span>
    <div style="margin-top:24px;width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>
  <div id="root"></div>
  <script>
    var s=document.getElementById('splash');
    var observer=new MutationObserver(function(){if(document.getElementById('root').children.length>0){s.style.opacity='0';setTimeout(function(){s.remove()},300);observer.disconnect()}});
    observer.observe(document.getElementById('root'),{childList:true});
    setTimeout(function(){if(s.parentNode){s.style.opacity='0';setTimeout(function(){s.remove()},300)}},10000);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
